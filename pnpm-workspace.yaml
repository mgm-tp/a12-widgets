# CI sets this to warn by default
loglevel: info
strictPeerDependencies: true
lockfileIncludeTarballUrl: false
# Quarantine: refuse versions published less than 7 days + 1 hour ago (minutes)
minimumReleaseAge: 10140
packages:
  - "*"

catalog:
  # React ecosystem
  react: ^19.3.0
  react-dom: ^19.3.0
  react-is: ^19.3.0
  styled-components: ^6.4.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0

  # Build tooling
  typescript: 6.0.3
  "@types/node": ^26.6.1
  rimraf: ^6.1.3
  vitest: ^5.0.1
  "@vitest/ui": ^5.0.1
  "@vitest/browser": ^5.0.1
  "@vitest/browser-playwright": ^5.0.1
  "@vitest/coverage-v8": ^5.0.1
  "@vitejs/plugin-react": ^6.1.1
  vite: ^8.3.0
  typedoc: ^0.28.20
  playwright: 1.63.0

  # Shared libraries
  date-fns: ^4.4.0
  lodash-es: ^4.18.1
  "@types/lodash-es": ^4.17.12
  react-transition-group: ^4.4.5
  "@types/react-transition-group": ^4.4.12
  deepmerge: ^4.3.1
  dompurify: ^3.4.15
  immer: ^11.1.18
  react-virtualized: ^9.22.6
  "@types/react-virtualized": ^9.22.3
  recharts: ^2.15.4
  polished: ^4.3.1
  ts-key-enum: ^2.0.13
  mobile-detect: ^1.4.5
  "@types/react-syntax-highlighter": ^15.5.13

  # Lexical
  lexical: ^0.51.0
  "@lexical/code-core": ^0.51.0
  "@lexical/code-shiki": ^0.51.0
  "@lexical/extension": ^0.51.0
  "@lexical/history": ^0.51.0
  "@lexical/html": ^0.51.0
  "@lexical/link": ^0.51.0
  "@lexical/list": ^0.51.0
  "@lexical/mdast": ^0.51.0
  "@lexical/plain-text": ^0.51.0
  "@lexical/react": ^0.51.0
  "@lexical/rich-text": ^0.51.0
  "@lexical/selection": ^0.51.0
  "@lexical/table": ^0.51.0
  "@lexical/utils": ^0.51.0

  # `@lexical/code-shiki` keeps its highlighter private,
  # so we reach the same packages it uses to register our own code theme. Ranges match its own.
  "@shikijs/core": ^4.4.3
  shiki: ^4.4.3

  # Markdown directive grammar
  "micromark-extension-directive": ^4.0.0
  "mdast-util-directive": ^3.1.0
  "mdast-util-to-markdown": ^2.1.2
  "mdast-util-from-markdown": ^2.0.3
  "@types/mdast": ^4.0.4
  "micromark-factory-space": ^2.0.1
  "micromark-factory-whitespace": ^2.0.1
  "micromark-util-character": ^2.1.1
  "micromark-util-symbol": ^2.0.1

  # Markdown source highlighting. `@lexical/mdast` runs micromark too, so both modes share a dialect.
  micromark: ^4.0.2
  "micromark-util-chunked": ^2.0.1
  "micromark-util-resolve-all": ^2.0.1
  "micromark-util-types": ^2.0.2

  # DnD
  react-dnd: ^16.0.1
  react-dnd-html5-backend: ^16.0.1

  # Other shared
  "@date-fns/tz": ^1.5.0

allowBuilds:
  esbuild: true

patchedDependencies:
  react-dnd@16.0.1: core/patches/pnpm/react-dnd@16.0.1.patch

overrides:
  "@rspack/core": 2.2.2

peerDependencyRules:
  allowedVersions:
    # @storybook/addon-vitest 10.6 still declares vitest ^3 || ^4 peers, but the
    # addon runs fine against the workspace vitest 5. Accept 5 here so pnpm does
    # not fail the strict peer check or pull a second vitest major into the tree.
    # Drop once the addon peers on vitest ^5.
    "@storybook/addon-vitest>vitest": "5"
    "@storybook/addon-vitest>@vitest/browser": "5"
    "@storybook/addon-vitest>@vitest/browser-playwright": "5"
    "@storybook/addon-vitest>@vitest/runner": "5"

minimumReleaseAgeExclude:
  - "@lexical/a11y@0.51.0"
  - "@lexical/clipboard@0.51.0"
  - "@lexical/code-core@0.51.0"
  - "@lexical/code-shiki@0.51.0"
  - "@lexical/devtools-core@0.51.0"
  - "@lexical/dragon@0.51.0"
  - "@lexical/extension@0.51.0"
  - "@lexical/hashtag@0.51.0"
  - "@lexical/history@0.51.0"
  - "@lexical/html@0.51.0"
  - "@lexical/internal@0.51.0"
  - "@lexical/link@0.51.0"
  - "@lexical/list@0.51.0"
  - "@lexical/mark@0.51.0"
  - "@lexical/markdown@0.51.0"
  - "@lexical/mdast@0.51.0"
  - "@lexical/overflow@0.51.0"
  - "@lexical/plain-text@0.51.0"
  - "@lexical/react@0.51.0"
  - "@lexical/rich-text@0.51.0"
  - "@lexical/selection@0.51.0"
  - "@lexical/table@0.51.0"
  - "@lexical/text@0.51.0"
  - "@lexical/utils@0.51.0"
  - "@lexical/yjs@0.51.0"
  - lexical@0.51.0
